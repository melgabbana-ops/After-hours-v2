<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09050D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AFTER HOURS" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link id="seasonal-favicon" rel="icon" type="image/svg+xml" href="%BASE_URL%icons/after-hours-master.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%after-hours-icon-192.svg" />
    <title>AFTER HOURS V2</title>
    <script>
      (() => {
        const d = new Date(), m = d.getMonth() + 1, day = d.getDate();
        const root = document.querySelector('meta[name="theme-color"]');
        const base = document.querySelector('link[rel="manifest"]')?.href.replace(/manifest\.webmanifest$/, '') || '/';
        let icon = base + 'icons/after-hours-master.svg';
        if ((m === 10 && day >= 20) || (m === 11 && day === 1)) icon = base + 'icons/after-hours-halloween.svg';
        else if (m === 12 && day >= 10 && day <= 27) icon = base + 'icons/after-hours-christmas.svg';
        else if ((m === 12 && day >= 28) || (m === 1 && day <= 3)) icon = base + 'icons/after-hours-new-year.svg';
        else if (m >= 3 && m <= 5) icon = base + 'icons/after-hours-spring.svg';
        else if (m >= 6 && m <= 8) icon = base + 'icons/after-hours-summer.svg';
        else if (m >= 9 && m <= 11) icon = base + 'icons/after-hours-autumn.svg';
        else if (m === 2 && day >= 7 && day <= 15) icon = base + 'icons/after-hours-valentines.svg';
        else if (m === 12 || m === 1 || m === 2) icon = base + 'icons/after-hours-winter.svg';
        const link = document.getElementById('seasonal-favicon');
        if (link) link.href = icon;
        if (root) root.content = '#09050D';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="%BASE_URL%src/main.tsx"></script>
  </body>
</html>
